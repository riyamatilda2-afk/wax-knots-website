<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wax & Knots Candles</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#8b63b0,#ccaff0);
color:black;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#ccaff0;
position:sticky;
top:0;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:45px;
height:45px;
border-radius:10px;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
background:#f4f2f5;
}

.hero h1{
font-size:38px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* PRODUCTS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
transition:0.3s;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:10px;
}

.price{
color:#8b63b0;
font-weight:bold;
}

button{
margin-top:10px;
padding:10px;
border:none;
background:#8b63b0;
color:white;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div class="logo">
<img src="assets/logo.png" alt="Wax & Knots Logo">
<h3>Wax & Knots</h3>
</div>
<div>Candles handcrafted to perfection</div>
</header>

<div class="hero">
<h1>Handcrafted Candles 🕯️</h1>
<p>Minimal • Elegant • Instagram-worthy • Luxury gifting</p>
</div>

<h2 style="padding-left:20px;">Shop</h2>

<div class="grid" id="shop"></div>

<script>

let products=[
{name:"Peony Candle",price:299,img:"assets/p3.png",desc:"Beautiful hand-poured peony scented candle with floral notes"},
{name:"Uruli Candle",price:399,img:"assets/p1.png",desc:"Traditional uruli design with warm, earthy tones"},
{name:"Lavender Bloom",price:349,img:"assets/p4.png",desc:"Relaxing lavender scent perfect for meditation and unwinding"},
{name:"Tea Lights Set",price:129,img:"assets/p2.png",desc:"Set of premium tea lights with long-lasting burn time"},
{name:"Sunflower Trio",price:999,img:"assets/p5.png",desc:"Elegant trio of sunflower-scented artisan candles"}
];

let shop=document.getElementById("shop");

function render(){
shop.innerHTML="";
products.forEach(p=>{
shop.innerHTML+=`
<div class="card">
<img src="${p.img}" alt="${p.name}">
<h3>${p.name}</h3>
<p style="font-size:14px;color:#666;">${p.desc}</p>
<p class="price">₹${p.price}</p>
<button onclick="buy('${p.name}',${p.price})">Order Now</button>
</div>
`;
});
}

function buy(name,price){
const message = `I want to order: ${name} - ₹${price}`;
const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
window.open(whatsappUrl, '_blank');
}

render();

</script>

</body>
</html>
